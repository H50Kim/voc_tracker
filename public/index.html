<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoC</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <button type="button" id="back-btn" class="icon-btn hidden" aria-label="뒤로">‹</button>
        <div class="brand">
          <strong>VoC</strong>
          <span>S&amp;E · 익명</span>
        </div>
        <button type="button" id="header-write" class="write-chip">글쓰기</button>
      </header>

      <nav class="topic-tabs" id="topic-tabs">
        <button type="button" class="tab active" data-sort="hot">인기</button>
        <button type="button" class="tab" data-sort="new">최신</button>
        <button type="button" class="tab" data-sort="all">전체</button>
        <button type="button" class="tab" data-topic="all">토픽</button>
      </nav>

      <main class="stage">
        <section id="view-home" class="view">
          <p id="board-meta" class="feed-count"></p>
          <div id="feed" class="feed"></div>
        </section>

        <section id="view-detail" class="view hidden">
          <div id="detail"></div>
        </section>

        <section id="view-write" class="view hidden">
          <h1 id="composer-title">글쓰기</h1>
          <p id="composer-hint" class="hint">익명으로 게시됩니다. 이메일은 노출되지 않습니다.</p>
          <form id="opinion-form" class="stack">
            <label>
              제목 / Ask S&amp;E Anything <span class="req">필수</span>
              <textarea id="ask" name="ask" rows="6" maxlength="4000" required placeholder="동료들에게 전하고 싶은 의견을 적어 주세요."></textarea>
            </label>
            <label>
              추가 내용
              <textarea id="others" name="others" rows="3" maxlength="4000" placeholder="선택 사항"></textarea>
            </label>
            <fieldset class="priority">
              <legend>토픽 · Priority</legend>
              <div class="scale" role="radiogroup" aria-label="Priority">
                <label><input type="radio" name="priority" value="0" /> Low</label>
                <label><input type="radio" name="priority" value="1" /> 낮음</label>
                <label><input type="radio" name="priority" value="2" checked /> 보통</label>
                <label><input type="radio" name="priority" value="3" /> 높음</label>
                <label><input type="radio" name="priority" value="4" /> 매우 높음</label>
                <label><input type="radio" name="priority" value="5" /> Super</label>
              </div>
            </fieldset>
            <button type="submit" id="submit-opinion">익명으로 게시</button>
          </form>
          <p id="form-error" class="error" hidden></p>
        </section>

        <section id="view-me" class="view hidden">
          <h1>내 정보</h1>
          <div id="me-card" class="me-card hidden">
            <p class="me-id">익명 <strong id="anon-label"></strong></p>
            <p id="role-label" class="chip role">User</p>
            <p class="hint">같은 이메일이면 항상 같은 익명 ID가 유지됩니다. 메일 주소는 공개되지 않습니다.</p>
            <button type="button" id="logout" class="ghost">로그아웃</button>
          </div>
          <section id="gate" class="me-card">
            <h2>로그인</h2>
            <p class="hint">이메일로 입장하면 고정 익명 ID가 부여됩니다.</p>
            <form id="auth-form" class="stack">
              <label>
                Email <span class="req">필수</span>
                <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </label>
              <button type="submit">로그인</button>
            </form>
            <p id="auth-error" class="error" hidden></p>
          </section>
        </section>
      </main>

      <nav class="bottom-nav">
        <button type="button" class="nav-btn active" data-view="home">홈</button>
        <button type="button" class="nav-btn write" data-view="write">글쓰기</button>
        <button type="button" class="nav-btn" data-view="me">내 정보</button>
      </nav>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
