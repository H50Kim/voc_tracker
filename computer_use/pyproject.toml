[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use"
version = "0.1.0"
description = "Windows Computer Use automation (Phase 1 foundation) for voc_tracker monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mss>=9.0.0",
  "Pillow>=10.0.0",
  "pynput>=1.7.6",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
computer-use-gui = "computer_use.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
